<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon CV - Ton Nom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #6366f1, #22c55e);
    }

    header h1 {
      font-size: 3em;
      margin: 0;
    }

    header p {
      font-size: 1.2em;
      opacity: 0.9;
    }

    section {
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }

    h2 {
      color: #22c55e;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin: 15px 0;
      border-radius: 15px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    footer {
      text-align: center;
      padding: 20px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<header>
  <h1>Ton Nom</h1>
  <p>Ton métier / spécialité</p>
</header>

<section>
  <h2>👤 À propos</h2>
  <div class="card">
    <p>Présente-toi ici (expérience, objectifs, personnalité).</p>
  </div>

  <h2>💼 Expériences</h2>
  <div class="card">
    <p><strong>Entreprise / Projet</strong><br> Description rapide</p>
  </div>

  <h2>🛠️ Compétences</h2>
  <div class="card">
    <p>HTML, CSS, Python, etc.</p>
  </div>

  <h2>📁 Projets</h2>
  <div class="card">
    <p>Projet 1 – description</p>
  </div>
</section>

<footer>
  © 2026 - Ton Nom
</footer>

</body>
</html>
